<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ WANDR — Карта подорожей</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <span class="logo-symbol">✦</span>
    <span class="logo-text">WANDR</span>
    <span class="logo-sub">карта подорожей</span>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap" id="searchWrap">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="search-input" id="searchInput" placeholder="Пошук міста або місця..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="header-stats">
    <div class="stat"><span class="stat-num" id="pinCount">0</span><span class="stat-label">точок</span></div>
    <div class="stat-divider"></div>
    <div class="stat"><span class="stat-num" id="photoCount">0</span><span class="stat-label">фото</span></div>
  </div>
</header>

<!-- MAP -->
<div id="map" style="position:fixed;inset:0;z-index:1;width:100vw;height:100vh;"></div>

<!-- BOTTOM TOOLBAR -->
<div class="bottom-toolbar">
  <button class="tool-btn" id="listToggle" title="Мої місця">
    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.5" fill="currentColor"/><circle cx="3" cy="12" r="1.5" fill="currentColor"/><circle cx="3" cy="18" r="1.5" fill="currentColor"/></svg>
    <span>Місця</span>
  </button>
  <button class="tool-btn" id="routeToggle" title="Маршрути">
    <svg viewBox="0 0 24 24"><path d="M3 17c3-3 4-7 9-7s6 4 9 7"/><circle cx="3" cy="17" r="2" fill="currentColor"/><circle cx="21" cy="17" r="2" fill="currentColor"/><circle cx="12" cy="10" r="2" fill="currentColor"/></svg>
    <span>Маршрути</span>
  </button>
  <a href="/gallery" class="tool-btn" title="Галерея">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><polyline points="21 15 16 10 5 21"/></svg>
    <span>Галерея</span>
  </a>
  <button class="tool-btn" id="buildRouteBtn" title="Створити маршрут">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span>Маршрут+</span>
  </button>
</div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-inner">
    <button class="sidebar-close" id="sidebarClose">✕</button>

    <div class="pin-header">
      <div class="pin-color-dot" id="pinColorDot"></div>
      <input class="pin-title-input" id="pinTitle" placeholder="Назва місця..." spellcheck="false">
    </div>

    <div class="color-picker-row">
      <span class="color-label">Колір</span>
      <div class="color-swatches" id="colorSwatches">
        <div class="swatch active" data-color="#00f5ff" style="background:#00f5ff"></div>
        <div class="swatch" data-color="#ff2d78" style="background:#ff2d78"></div>
        <div class="swatch" data-color="#b8ff57" style="background:#b8ff57"></div>
        <div class="swatch" data-color="#ff9f00" style="background:#ff9f00"></div>
        <div class="swatch" data-color="#bf5af2" style="background:#bf5af2"></div>
        <div class="swatch" data-color="#ffffff" style="background:#ffffff"></div>
      </div>
    </div>

    <!-- WEATHER -->
    <div class="weather-card" id="weatherCard" style="display:none">
      <div class="weather-inner" id="weatherInner">
        <div class="weather-loading">⟳ Завантаження погоди...</div>
      </div>
    </div>

    <textarea class="pin-note" id="pinNote" placeholder="Нотатки, враження, спогади..."></textarea>

    <div class="photos-section">
      <div class="photos-header">
        <span class="section-title">ФОТО</span>
        <label class="upload-btn" for="photoUpload">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7-7 7 7"/></svg>
          Додати
        </label>
        <input type="file" id="photoUpload" accept="image/*" multiple style="display:none">
      </div>
      <div class="photos-grid" id="photosGrid"></div>
    </div>

    <div class="sidebar-actions">
      <button class="btn-save" id="btnSave">Зберегти</button>
      <button class="btn-delete" id="btnDelete">Видалити</button>
    </div>
    <div class="pin-meta" id="pinMeta"></div>
  </div>
</aside>

<!-- PINS DRAWER -->
<div class="pins-drawer" id="pinsDrawer">
  <div class="drawer-header">
    <span class="drawer-title">МОЇ МІСЦЯ</span>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<!-- ROUTES DRAWER -->
<div class="pins-drawer routes-drawer" id="routesDrawer">
  <div class="drawer-header">
    <span class="drawer-title">МАРШРУТИ</span>
    <button class="drawer-close" id="routesDrawerClose">✕</button>
  </div>
  <div class="drawer-list" id="routesList"></div>
</div>

<!-- BUILD ROUTE PANEL -->
<div class="route-builder" id="routeBuilder" style="display:none">
  <div class="rb-header">
    <span class="rb-title">НОВИЙ МАРШРУТ</span>
    <button class="rb-close" id="rbClose">✕</button>
  </div>
  <input class="rb-name" id="rbName" placeholder="Назва маршруту...">
  <div class="rb-hint">Клікайте на точки на карті щоб додати їх до маршруту</div>
  <div class="rb-pins" id="rbPins"></div>
  <div class="color-swatches" id="rbColors" style="margin:10px 0">
    <div class="swatch active" data-color="#00f5ff" style="background:#00f5ff"></div>
    <div class="swatch" data-color="#ff2d78" style="background:#ff2d78"></div>
    <div class="swatch" data-color="#b8ff57" style="background:#b8ff57"></div>
    <div class="swatch" data-color="#ff9f00" style="background:#ff9f00"></div>
    <div class="swatch" data-color="#bf5af2" style="background:#bf5af2"></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn-save" id="rbSave" style="font-size:14px;padding:10px">Зберегти маршрут</button>
    <button class="btn-delete" id="rbCancel" style="padding:10px 14px">Скасувати</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<div class="new-pin-tooltip" id="newPinTooltip">Точку додано! Заповніть деталі →</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
